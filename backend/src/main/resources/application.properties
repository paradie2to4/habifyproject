# Spring Boot Configuration for Habify
spring.application.name=smart-rental-backend

# Server (Render provides PORT)
server.port=${SERVER_PORT:${PORT:8080}}

# PostgreSQL / Neon — required via env (see backend/.env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# SQL initialization (seed demo data when empty / first boot)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins / patterns (Vercel + localhost)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator (Render health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Public URL of the website (used in email links)
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Email via Resend (https://resend.com). Without a key, emails are logged instead.
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:Habify <onboarding@resend.dev>}

# Photo uploads via Cloudinary: cloudinary://<api_key>:<api_secret>@<cloud_name>
app.cloudinary.url=${CLOUDINARY_URL:}

# Uploads: browser resizes photos first, so 4 MB is generous
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Behind Render's proxy: build https:// links from X-Forwarded-* headers
server.forward-headers-strategy=framework

# Mobile money (see MobileMoneyService for details). Leave blank to keep it switched off.
app.momo.mtn.subscription-key=${MOMO_MTN_SUBSCRIPTION_KEY:}
app.momo.mtn.api-user=${MOMO_MTN_API_USER:}
app.momo.mtn.api-key=${MOMO_MTN_API_KEY:}
app.momo.mtn.target-env=${MOMO_MTN_TARGET_ENV:sandbox}
app.momo.mtn.base-url=${MOMO_MTN_BASE_URL:https://sandbox.momodeveloper.mtn.com}
app.momo.mtn.currency=${MOMO_MTN_CURRENCY:EUR}
app.momo.airtel.client-id=${AIRTEL_CLIENT_ID:}
app.momo.airtel.client-secret=${AIRTEL_CLIENT_SECRET:}
app.momo.airtel.base-url=${AIRTEL_BASE_URL:https://openapiuat.airtel.africa}
app.momo.airtel.country=${AIRTEL_COUNTRY:RW}
app.momo.airtel.currency=${AIRTEL_CURRENCY:RWF}
# Local testing only: approve mobile-money requests automatically
app.momo.simulate=${MOMO_SIMULATE:false}

# Claude assistant (https://platform.claude.com). Without a key the website uses its built-in assistant.
app.assistant.api-key=${ANTHROPIC_API_KEY:}
app.assistant.model=${ASSISTANT_MODEL:claude-opus-5-5}
app.assistant.max-requests-per-hour=${ASSISTANT_RATE_LIMIT:30}
