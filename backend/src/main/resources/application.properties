# Spring Boot Configuration for Habify (Smart Rental)
spring.application.name=smart-rental-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL — defaults match docker-compose.yml and RUNNING.md
# Override with SPRING_DATASOURCE_URL / USERNAME / PASSWORD, or DB_* vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:habify}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:mami}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Run schema/data scripts only when the schema is empty / first boot
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT
jwt.secret=${JWT_SECRET:9a618cf387d2a22f61b00d41a700ece838865fae612880d879fb9e6a0a90171e}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
