# In-memory H2 profile — no PostgreSQL required
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.config.activate.on-profile=h2

spring.datasource.url=jdbc:h2:mem:habify;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Skip Postgres-specific schema.sql; use data.sql after Hibernate creates tables
spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.continue-on-error=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
